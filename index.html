<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Smart Workflows | B2B Automation</title>
</head>
<body style="margin: 0; font-family: system-ui, sans-serif; background: #F8F9FA;">

    <!-- This line loads your header automatically -->
    <script src="header.js"></script>

    <!-- MAIN HOMEPAGE CONTENT -->
    <main style="min-height: 70vh; padding: 60px 5%; text-align: center; max-width: 800px; margin: 0 auto;">
        <h1 style="color: #0B3954; font-size: 2.5rem;">Automate Your Operations</h1>
        <p style="color: #475569; font-size: 1.2rem; line-height: 1.6;">
            We build custom GPTs, deploy smart chatbots, and create n8n & Make.com workflows that save your business hours of manual work every single week.
        </p>
        
        <div style="margin-top: 40px; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <h2 style="color: #0B3954;">Ready to scale?</h2>
            <p style="color: #475569; margin-bottom: 20px;">Tell us what you want to automate.</p>
            <!-- Replace YOUR_FORM_ID with your actual Formspree ID -->
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="email" name="email" placeholder="Your Email" required style="padding: 12px; border: 1px solid #ddd; border-radius: 4px;">
                <textarea name="message" placeholder="Describe the workflow you need..." required style="padding: 12px; border: 1px solid #ddd; border-radius: 4px; min-height: 100px;"></textarea>
                <button type="submit" style="background: #10B981; color: white; border: none; padding: 15px; border-radius: 4px; font-weight: bold; cursor: pointer;">Send Request</button>
            </form>
        </div>
    </main>

    <!-- These lines load your footer and FAQ widget automatically -->
    <script src="footer.js"></script>
    <script src="chatbot.js"></script>

</body>
</html>
